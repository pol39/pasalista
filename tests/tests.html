<!doctype html>
<meta charset="utf-8">
<title>Pruebas de PasaLista</title>
<body style="font:16px system-ui;padding:1rem">
<h1>Pruebas de PasaLista</h1>
<p>Todo debe salir en verde (✓). Abre esta página con el servidor local (ver instrucciones).</p>
<ul id="r"></ul>
<script type="module">
import { estaActivo, grupoEn, nuevoParticipante, darDeBaja, reactivar, cambiarGrupo, diasGrupo } from '../js/logic/periods.js';
import { especialEn, listaDelDia, estadoDia, porcentaje } from '../js/logic/sessions.js';
import { porEdadYNombre } from '../js/utils/orden.js';
import { registrosDe, conteo, previstos, rachas, estadisticasTemporada } from '../js/logic/stats.js';
import { TEXTOS } from '../js/textos.js';
const ul = document.getElementById('r');
const prueba = (nombre, f) => {
  let ok = false, msg = '';
  try { ok = f() === true; } catch (e) { msg = ' — error: ' + e.message; }
  ul.append(Object.assign(document.createElement('li'), { textContent: (ok ? '✓ ' : '✗ ') + nombre + msg, style: 'color:' + (ok ? 'green' : 'red') }));
};
const base = () => nuevoParticipante({ id: '1', nombre: 'Marta', anyNacimiento: 2016, notas: '', grupoId: 'A', mes: '2025-10' }, null);

prueba('Entra en octubre: NO aparece en septiembre', () => !estaActivo(base(), '2025-09'));
prueba('Entra en octubre: aparece en octubre y en los meses siguientes', () => estaActivo(base(), '2025-10') && estaActivo(base(), '2026-05'));
prueba('Baja desde diciembre: sigue en noviembre y desaparece desde diciembre', () => {
  const p = darDeBaja(base(), '2025-12');
  return estaActivo(p, '2025-11') && !estaActivo(p, '2025-12') && !estaActivo(p, '2026-03');
});
prueba('Reactivar en enero: sigue sin estar en diciembre, vuelve en enero y conserva 2 períodos', () => {
  const p = reactivar(darDeBaja(base(), '2025-12'), '2026-01', 'A');
  return estaActivo(p, '2025-11') && !estaActivo(p, '2025-12') && estaActivo(p, '2026-01') && p.periodos.length === 2;
});
prueba('No se puede reactivar a alguien que ya está de alta', () => { try { reactivar(base(), '2026-01', 'A'); return false; } catch { return true; } });
prueba('Baja en el mismo mes del alta: nunca aparece', () => !estaActivo(darDeBaja(base(), '2025-10'), '2025-10'));
prueba('Cambio de grupo en enero: A hasta diciembre, B desde enero', () => {
  const p = cambiarGrupo(base(), '2026-01', 'B');
  return grupoEn(p, '2025-12') === 'A' && grupoEn(p, '2026-01') === 'B' && grupoEn(p, '2026-06') === 'B';
});
prueba('Cambio de grupo, luego baja: el historial de grupos se mantiene', () => {
  const p = darDeBaja(cambiarGrupo(base(), '2026-01', 'B'), '2026-03');
  return grupoEn(p, '2025-11') === 'A' && grupoEn(p, '2026-02') === 'B' && !estaActivo(p, '2026-03');
});

// ---- Fase 2: listas, días no lectivos y porcentajes ----
const gA = { id: 'A', nombre: 'Prebenjamines', dias: [2, 4, 5] }, gB = { id: 'B', nombre: 'Benjamines', dias: [1, 2, 3, 4, 5] };
const grupos = [gA, gB];
const p1 = nuevoParticipante({ id: 'p1', nombre: 'Marta', grupoId: 'A', mes: '2025-10' });
const p2 = nuevoParticipante({ id: 'p2', nombre: 'Leo', grupoId: 'A', mes: '2025-12' });
const ids = l => l.map(p => p.id).join();
const esp = [{ fecha: '2025-11-04', grupoId: 'A', tipo: 'Huelga' }, { fecha: '2025-11-06', grupoId: null, tipo: 'Festivo' }];
const regs = [{ estado: 'presente' }, { estado: 'presente' }, { estado: 'ausente' }, { estado: 'ausente', justificada: true }, undefined];

prueba('Martes 4 nov: solo Marta (Leo aún no ha entrado); el miércoles el grupo no entrena', () =>
  ids(listaDelDia('2025-11-04', gA, [p1, p2], grupos)) === 'p1' && listaDelDia('2025-11-05', gA, [p1, p2], grupos).length === 0);
prueba('Martes 2 dic: Leo ya aparece desde su mes de alta', () => ids(listaDelDia('2025-12-02', gA, [p1, p2], grupos)) === 'p2,p1');
prueba('Día no lectivo solo para el grupo A: afecta a A y no a B', () => !!especialEn('2025-11-04', 'A', esp) && !especialEn('2025-11-04', 'B', esp));
prueba('Día no lectivo para todos: afecta a todos los grupos', () => !!especialEn('2025-11-06', 'A', esp) && !!especialEn('2025-11-06', 'B', esp));
prueba('Entreno pasado sin marcar = pendiente; marcado = completo; no lectivo = no cuenta', () => {
  const reg = new Map(), ctx = { parts: [p1], grupos, especiales: [], sesiones: [], reg };
  const a = estadoDia('2025-11-04', gA, ctx).tipo;
  reg.set('p1|2025-11-04', { estado: 'presente' });
  const b = estadoDia('2025-11-04', gA, ctx).tipo;
  const c = estadoDia('2025-11-04', gA, { ...ctx, especiales: esp }).tipo;
  return a === 'pendiente' && b === 'completa' && c === 'nolectivo';
});
prueba('Justificado EXCLUYE: 2 presentes de 3 sesiones computables = 67 %', () => porcentaje(regs, 'excluye') === 67);
prueba('Justificado CUENTA como asistencia: 3 de 4 = 75 %', () => porcentaje(regs, 'cuenta') === 75);
prueba('Días sin lista pasada no cuentan: sin ninguna marca no hay porcentaje', () => porcentaje([undefined, { estado: null }], 'excluye') === null);
prueba('Cambio de días del grupo desde enero: los meses anteriores conservan los antiguos', () => {
  const g = { dias: [1, 2, 3], diasHist: [{ desde: '0000-00', dias: [2, 4] }, { desde: '2026-01', dias: [1, 2, 3] }] };
  return diasGrupo(g, '2025-12').join() === '2,4' && diasGrupo(g, '2026-02').join() === '1,2,3';
});

// ---- Mejoras: festivos y orden ----
prueba('Un festivo es festivo para TODOS los grupos, aunque se guardara con un grupo', () => {
  const f = [{ fecha: '2025-11-07', grupoId: 'A', tipo: 'Festivo' }];
  return !!especialEn('2025-11-07', 'A', f) && !!especialEn('2025-11-07', 'B', f);
});
prueba('Orden: primero por edad (menor a mayor), luego alfabético; sin año de nacimiento al final', () => {
  const l = [{ id: 'a', nombre: 'Zoe', anyNacimiento: 2018 }, { id: 'b', nombre: 'Ana', anyNacimiento: 2016 },
             { id: 'c', nombre: 'Ada', anyNacimiento: 2018 }, { id: 'd', nombre: 'Aaron', anyNacimiento: null }];
  return l.sort(porEdadYNombre).map(x => x.id).join() === 'c,a,b,d';
});

// ---- Estadísticas: solo cuentan los días de entreno ya realizados con la lista pasada ----
const HOY = '2026-01-01';
const q1 = nuevoParticipante({ id: 'q1', nombre: 'Marta', grupoId: 'A', mes: '2025-10' });
const q2 = nuevoParticipante({ id: 'q2', nombre: 'Leo', grupoId: 'A', mes: '2025-10' });
const marca = (pid, fecha, estado, extra = {}) => ({ id: `${pid}|${fecha}`, participanteId: pid, fecha, estado, justificada: false, retraso: false, comentario: '', ...extra });
const festivoJueves = [{ fecha: '2025-11-06', grupoId: null, tipo: 'Festivo' }];

prueba('Estadística: un día futuro marcado y un día no lectivo NO cuentan', () => {
  const suyas = [marca('q1', '2025-11-04', 'presente'), marca('q1', '2025-11-06', 'ausente'), marca('q1', '2099-01-01', 'presente')];
  return registrosDe(q1, suyas, festivoJueves, HOY).length === 1;
});
prueba('Días previstos: nov 2025 tiene 11 entrenos (martes, jueves y viernes) quitando el festivo del jueves 6', () =>
  previstos(q1, '2025-11-01', '2025-11-30', grupos, festivoJueves, '2025-11-30').length === 11);
prueba('Conteo: justificado EXCLUYE (2 de 3 = 67 %) o CUENTA (3 de 4 = 75 %); retrasos y justificadas aparte', () => {
  const r = [marca('q1', '2025-11-04', 'presente'), marca('q1', '2025-11-07', 'presente', { retraso: true }), marca('q1', '2025-11-11', 'ausente'), marca('q1', '2025-11-13', 'ausente', { justificada: true })];
  const a = conteo(r, 'excluye'), b = conteo(r, 'cuenta');
  return a.pct === 67 && a.computables === 3 && a.retrasos === 1 && a.justificadas === 1 && b.pct === 75 && b.computables === 4;
});
prueba('Temporada: % de cada mes y general, solo con días ya realizados', () => {
  const temp = { inicio: '2025-10-01', fin: '2026-06-30' };
  const as = [marca('q1', '2025-10-07', 'presente'), marca('q1', '2025-11-04', 'ausente'), marca('q2', '2025-11-04', 'presente'), marca('q2', '2099-01-01', 'presente')];
  const e = estadisticasTemporada(temp, [q1, q2], grupos, as, [], 'excluye', HOY);
  return e.meses.length === 9 && e.meses[0].conteo.pct === 100 && e.meses[1].conteo.pct === 50 && e.total.pct === 67 && e.meses[1].porGrupo[0].grupoId === 'A';
});
prueba('Rachas: 3 presencias seguidas / 2 faltas seguidas', () => {
  const P = { estado: 'presente' }, A = { estado: 'ausente' };
  return rachas([P, P, A, P, P, P]).presencias === 3 && rachas([P, A, A]).faltas === 2;
});
prueba('Idiomas: todas las traducciones existen y tienen las mismas variables {x}', () =>
  Object.entries(TEXTOS).every(([k, [ca, en]]) => ca && en && [ca, en].every(s => (s.match(/\{\w+\}/g) || []).sort().join() === (k.match(/\{\w+\}/g) || []).sort().join())));
</script>
